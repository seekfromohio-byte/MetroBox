name: Build and release MetroBox

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            args: --linux --x64
          - name: Windows x64 and ARM64
            os: windows-latest
            args: --win --x64 --arm64
          - name: macOS universal
            os: macos-latest
            args: --mac --universal
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Set app version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Build installers
        # A v* tag makes electron-builder infer GitHub publishing by default.
        # Keep publishing centralized in the release job below, which combines
        # artifacts from all three native build runners.
        run: npm run dist -- --publish never ${{ matrix.args }}
      - name: Build Flatpak bundle
        if: matrix.name == 'Linux x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          npm run dist:flatpak
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: MetroBox-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: MetroBox ${{ github.ref_name }}
          body: |
            ## What's changed

            - Restored the responsive MetroBox Material 3 interface from v2.0.10 and removed the glitchy Material Web component layer.
            - Faster large MP4 downloads where servers support parallel range requests, plus pause and resume controls.
            - Playback diagnostics, lighter player UI updates, and improved ffmpeg stream backpressure handling.
            - Windows x64/ARM64, universal macOS, Debian, AppImage, and Flatpak packages.

            ## Install notes

            The Windows and macOS builds are unsigned. Windows may show SmartScreen, and macOS may ask you to approve opening MetroBox in Privacy & Security.
          fail_on_unmatched_files: true
          files: dist/*
